// ============================================================
// 【2026-10-25 文件锁自愈】根治 shrinkReleaseRes 的 resources.txt「拒绝访问」
// ------------------------------------------------------------
// 现象（高频复发，全量构建或改资源后的重建都可能中）：
//   Execution failed for task ':app:shrinkReleaseRes'.
//   > A failure occurred while executing ShrinkProtoResourcesAction
//      > ...\app\build\outputs\mapping\release\resources.txt (拒绝访问。)
// 实测归因（2026-10-25 用 Restart Manager 抓句柄）：
//   ① 该文件是 shrinkReleaseRes 自己的产出（内容为 "Marking xxx reachable" 资源报告），
//      不是 R8 的输入，删掉后任务会自行重建 —— 所以「任务前预删」安全；
//   ② 构建结束后 Gradle 守护进程（java.exe）仍持有该文件句柄约 12 秒才释放，
//      紧接着的下一次构建去写同名文件 → Access Denied。
// 旧解法靠人工「gradlew --stop + 删文件 + 重跑」，现在改为任务内自愈：
//   任务真正要执行时先清只读位并重试删除（最长 15s，覆盖句柄释放窗口），随后任务重建该文件。
//   无锁时首次删除即成功，零额外耗时；任务若 UP-TO-DATE 则本钩子根本不执行。
// ============================================================
def mappingReleaseDirAtConfig = new File(project.layout.buildDirectory.get().asFile, 'outputs/mapping/release')
tasks.matching { it.name == 'shrinkReleaseRes' }.configureEach {
    doFirst {
        File f = new File(mappingReleaseDirAtConfig, 'resources.txt')
        if (!f.exists()) return
        try { f.setWritable(true) } catch (Throwable ignored) { }
        long t0 = System.currentTimeMillis()
        boolean cleared = f.delete()
        if (!cleared) {
            // delete 失败：多半是被外部进程（Defender/索引器）锁。Windows 下 rename 常能绕过文件锁，
            // 把旧文件移走，使 shrinkReleaseRes 能创建全新的 resources.txt（新句柄，不受旧锁影响）。
            for (int i = 0; i < 40 && !cleared; i++) {
                try {
                    File moved = new File(mappingReleaseDirAtConfig, "resources.txt.bak-${System.nanoTime()}")
                    if (f.renameTo(moved)) {
                        cleared = true
                        logger.lifecycle("[lock-fix] resources.txt 被外部进程占用且 delete 失败，已 rename 移走以绕过文件锁")
                    }
                } catch (Throwable ignored) { }
                if (!cleared) Thread.sleep(500L)
            }
        }
        long waited = System.currentTimeMillis() - t0
        if (!cleared) {
            logger.lifecycle("[lock-fix] resources.txt 在 ${waited}ms 内仍无法 delete/rename（疑似 Defender/索引器独占锁）；" +
                    "建议将 build 目录加入 Windows Defender 排除：Add-MpPreference -ExclusionPath \"${mappingReleaseDirAtConfig.absolutePath}\"")
        } else if (waited >= 500L) {
            logger.lifecycle("[lock-fix] resources.txt 占用 ${waited}ms 后已让道，任务将重建")
        }
    }
    doLast {
        // 用户要求：不再保留 resources.txt 这份资源压缩映射报告。
        // 说明：AGP 在 shrinkResources=true 时由 ResourceShrinker 在分析阶段必然写出该文件，
        //   下游任务不读取它、也不进 APK，AGP 无单独开关"不生成"。因此只能任务结束后主动删掉。
        // 附带根治文件锁：删掉后下次构建时 resources.txt 不存在，doFirst 直接跳过，
        //   aapt2 以全新文件重建，彻底绕开"覆盖已锁旧文件"导致的「拒绝访问」。
        try {
            File dir = mappingReleaseDirAtConfig
            if (dir.exists()) {
                File report = new File(dir, 'resources.txt')
                if (report.exists()) { try { report.delete() } catch (Throwable ignored) { } }
                File[] bakFiles = dir.listFiles(new FileFilter() {
                    boolean accept(File fn) { return fn.name.startsWith('resources.txt.bak-') }
                })
                if (bakFiles != null) {
                    for (File b : bakFiles) { try { b.delete() } catch (Throwable ignored) { } }
                }
            }
        } catch (Throwable ignored) { }
    }
}
